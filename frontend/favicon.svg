<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Pulsing Outer Ring Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Radiant Dot Gradient -->
    <radialGradient id="coreGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Orbital Ring Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Canvas -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>

  <!-- Outer Satellite Orbital Track -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="17" fill="url(#pulseGlow)" filter="url(#glow)"/>

  <!-- Satellite Sensor Node on Orbit -->
  <circle cx="48" cy="20" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="48" cy="20" r="1.2" fill="#ffffff"/>

  <!-- Inner Pulsing Ring -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" filter="url(#glow)"/>

  <!-- Central Radiant Core Dot -->
  <circle cx="32" cy="32" r="7.5" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="30" cy="30" r="2.2" fill="#ffffff" fill-opacity="0.8"/>
</svg>
